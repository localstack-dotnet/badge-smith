name: CI Pipeline

on:
  push:
    paths-ignore:
      - "**.md"
      - LICENSE
    branches:
      - "master"
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
    branches:
      - master
      - "feature/*"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.head_commit.message, '***NO_CI***')
    env:
      NUGET_PACKAGES: ${{ format('{0}/.nuget/packages', github.workspace) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run delivery fixture tests
        run: node --test .github/scripts/delivery/delivery.test.mjs

      - name: "Cache NuGet packages"
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.nuget/packages', github.workspace) }}
          key: nuget-${{ hashFiles('**/Directory.Packages.props') }}-${{ hashFiles('**/*.csproj') }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with BadgeSmith integration
        uses: ./.github/workflows/run-dotnet-tests
        with:
          project-path: 'tests/BadgeSmith.Api.Tests/BadgeSmith.Api.Tests.csproj'
          results-dir: 'test-results'
          configuration: 'Release'

      - name: Run CDK contract tests
        if: success() || failure()
        run: >-
          dotnet test tests/BadgeSmith.CDK.Tests/BadgeSmith.CDK.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=cdk-tests.trx"
          --results-directory cdk-test-results

      - name: Publish Test Results
        id: test-results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: 'Test Results (Linux)'
          path: 'test-results/**/*.trx'
          reporter: 'dotnet-trx'
          path-replace-backslashes: true
          fail-on-error: true
          max-annotations: 50

      - name: Publish CDK Test Results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: 'CDK Test Results (Linux)'
          path: 'cdk-test-results/**/*.trx'
          reporter: 'dotnet-trx'
          path-replace-backslashes: true
          fail-on-error: true
          max-annotations: 50

      - name: Update test badge via BadgeSmith API
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: ./.github/workflows/update-test-badge
        with:
          platform: 'Linux'
          test_passed: '${{ steps.test-results.outputs.passed || 0 }}'
          test_failed: '${{ steps.test-results.outputs.failed || 0 }}'
          test_skipped: '${{ steps.test-results.outputs.skipped || 0 }}'
          test_url_html: ${{ steps.test-results.outputs.url_html || '' }}
          commit_sha: '${{ github.sha }}'
          run_id: '${{ github.run_id }}'
          repository: '${{ github.repository }}'
          server_url: '${{ github.server_url }}'
          api_base_url: 'https://api.localstackfor.net'
          hmac_secret: '${{ secrets.TESTDATASECRET }}'

  continuous-deployment:
    needs: build-and-test
    if: |
      github.repository == 'localstack-dotnet/badge-smith' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/'))) &&
      !contains(github.event.head_commit.message, '[skip cd]') &&
      !contains(github.event.head_commit.message, '[cd skip]') &&
      !contains(github.event.head_commit.message, '[skip-cd]') &&
      !contains(github.event.head_commit.message, '[cd-skip]') &&
      !contains(github.event.head_commit.message, '***NO_CD***')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Lambda ZIP for ARM64
        env:
          BADGESMITH_TOOL_PATH: ${{ github.workspace }}/tools/badgesmith.cs
        run: |
          "$BADGESMITH_TOOL_PATH" lambda build --target zip --rid linux-arm64 --clean --verbose

      - name: Record Lambda ZIP provenance
        run: node .github/scripts/delivery/artifact.mjs record

      - name: Upload Lambda artifact
        id: lambda-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref == 'refs/heads/master' && format('lambda-zip-{0}-{1}', github.run_id, github.run_attempt) || format('{0}-{1}-{2}', format('lambda-zip-pr-{0}', github.event.pull_request.number), github.run_id, github.run_attempt) }}
          path: |
            artifacts/badge-lambda-linux-arm64.zip
            artifacts/provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Artifact selection summary
        env:
          ARTIFACT_ID: ${{ steps.lambda-artifact.outputs.artifact-id }}
          ARCHIVE_DIGEST: ${{ steps.lambda-artifact.outputs.artifact-digest }}
        run: |
          echo '## CI artifact selection' >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_RUN_ID; attempt: $GITHUB_RUN_ATTEMPT; SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact ID: $ARTIFACT_ID; archive digest: $ARCHIVE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/provenance.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
