name: "Run .NET tests (multi-TFM)"
description: "Build once, test each target framework, unique TRX per framework"
inputs:
  project-path:
    description: "Path to the test .csproj file"
    required: true
  results-dir:
    description: "Directory for test result artefacts"
    required: true
  configuration:
    description: "Build configuration"
    default: "Release"
runs:
  using: "composite"
  steps:
    # Windows step -----------------------------------------------------------
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        dotnet run --file "${{ github.workspace }}/tools/badgesmith.cs" -- tests run `
          --project-path "${{ inputs.project-path }}" `
          --results-dir "${{ inputs.results-dir }}" `
          --configuration "${{ inputs.configuration }}"

    # Linux/macOS step -------------------------------------------------------
    - if: runner.os != 'Windows'
      shell: bash
      run: |
        "${{ github.workspace }}/tools/badgesmith.cs" tests run \
          --project-path "${{ inputs.project-path }}" \
          --results-dir "${{ inputs.results-dir }}" \
          --configuration "${{ inputs.configuration }}"
