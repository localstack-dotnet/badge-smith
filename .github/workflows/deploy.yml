name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      ci_run_id:
        description: 'Successful push/master CI run ID'
        required: true
        type: string
      ci_run_attempt:
        description: 'Successful CI run attempt'
        required: true
        type: string
      ci_head_sha:
        description: 'Full source SHA of that CI run'
        required: true
        type: string
      ci_artifact_id:
        description: 'Immutable Lambda artifact ID from that run/attempt'
        required: true
        type: string
      smoke_test_badge_path:
        description: 'Existing /badges/tests/{platform}/{owner}/{repo}/{branch} path (no query)'
        required: true
        type: string
      smoke_nuget_badge_path:
        description: 'Existing /badges/packages/nuget/{package} path (no query)'
        required: true
        type: string

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    if: github.ref == 'refs/heads/master' && github.repository == 'localstack-dotnet/badge-smith'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: production-delivery
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      NUGET_PACKAGES: ${{ format('{0}/.nuget/packages', github.workspace) }}
      SMOKE_TEST_BADGE_PATH: ${{ inputs.smoke_test_badge_path }}
      SMOKE_NUGET_BADGE_PATH: ${{ inputs.smoke_nuget_badge_path }}
    steps:
      - name: Checkout delivery controls
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run delivery fixture tests
        run: node --test .github/scripts/delivery/delivery.test.mjs

      - name: Validate required smoke inputs
        run: node .github/scripts/delivery/smoke.mjs validate

      - name: Validate and download CI artifact
        id: artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          CI_HEAD_SHA: ${{ inputs.ci_head_sha }}
          CI_ARTIFACT_ID: ${{ inputs.ci_artifact_id }}
        run: node .github/scripts/delivery/artifact.mjs promote

      - name: Checkout verified infrastructure source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.artifact.outputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Place verified Lambda ZIP
        run: |
          mkdir -p source/artifacts
          cp artifacts/badge-lambda-linux-arm64.zip source/artifacts/badge-lambda-linux-arm64.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-badge-smith-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: source/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.nuget/packages', github.workspace) }}
          key: nuget-${{ hashFiles('source/**/Directory.Packages.props') }}-${{ hashFiles('source/**/*.csproj') }}-${{ hashFiles('source/**/packages.lock.json') }}
          restore-keys: |
            nuget-

      - name: Install AWS CDK
        run: npm install --global aws-cdk@2.1135.1

      - name: Restore .NET dependencies
        working-directory: source
        run: dotnet restore

      - name: Build CDK project
        working-directory: source
        run: dotnet build build/BadgeSmith.CDK --configuration Release

      - name: CDK synth
        working-directory: source/build
        run: cdk synth BadgeSmithStack

      # Explicit change-set mode prevents auto fallback from masking diff errors.
      # This can create a CloudFormation change set; existing role permissions apply.
      - name: CDK diff
        working-directory: source/build
        run: cdk diff BadgeSmithStack --no-fail --method change-set

      - name: CDK deploy
        working-directory: source/build
        run: cdk deploy BadgeSmithStack --require-approval never --outputs-file ../../artifacts/cdk-outputs.json

      - name: Health and badge smoke
        run: node .github/scripts/delivery/smoke.mjs run

      - name: Deployment summary
        run: |
          echo '## Deployment and GET smoke passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source, run, attempt, artifact, archive and ZIP evidence are recorded above.' >> "$GITHUB_STEP_SUMMARY"
